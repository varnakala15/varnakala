<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment & Order Summary - DC Textile</title>
    <link rel="stylesheet" href="payment.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- HTML to PDF Convert කරන Library එක -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

    <div class="bill-container" id="invoice-bill">
        <div class="bill-header">
            <h2>DC Textile - Invoice</h2>
            <p>Order Summary</p>
            <p id="order-id-display" style="font-weight: bold; color: #2c3e50; font-size: 14px; margin-top: 5px;"></p>
        </div>

        <table class="bill-table">
            <thead>
                <tr>
                    <th>Item Name (Code)</th>
                    <th>Price</th>
                    <th>Qty</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="bill-items">
                <!-- Data JavaScript මඟින් එකතු වේ -->
            </tbody>
        </table>

        <div class="total-section">
            <span>Grand Total:</span>
            <span id="grand-total">Rs. 0.00</span>
        </div>

        <!-- Customer Details Form Section -->
        <div class="customer-details-card">
            <h3>Customer Details</h3>
            <form id="customerForm">
                <!-- 1st Row: Name -->
                <div class="form-row">
                    <div class="form-group full-width">
                        <label for="custName">Full Name *</label>
                        <input type="text" id="custName" placeholder="Enter Full Name" required>
                    </div>
                </div>

                <!-- 2nd Row: Phone & WhatsApp -->
                <div class="form-row">
                    <div class="form-group half-width">
                        <label for="custPhone">Phone Number *</label>
                        <input type="tel" id="custPhone" placeholder="07XXXXXXXX" required>
                    </div>
                    <div class="form-group half-width">
                        <label for="custWhatsapp">WhatsApp Number *</label>
                        <input type="tel" id="custWhatsapp" placeholder="07XXXXXXXX" required>
                    </div>
                </div>

                <!-- 3rd Row: Address & Postal Code -->
                <div class="form-row">
                    <div class="form-group half-width">
                        <label for="custAddress">Delivery Address *</label>
                        <input type="text" id="custAddress" placeholder="Enter Address" required>
                    </div>
                    <div class="form-group half-width">
                        <label for="custPostal">Postal Code *</label>
                        <input type="text" id="custPostal" placeholder="Enter Postal Code" required>
                    </div>
                </div>
            </form>
        </div>

        <!-- Buttons Section -->
        <div class="btn-group">
            <a href="index.html" class="btn btn-back">Continue Shopping</a>
            <button type="button" class="btn" style="background-color: #3498db; color: white;" onclick="downloadPDF()">Download PDF</button>
            <button type="button" class="btn btn-pay" onclick="processPayment()">Proceed to Pay</button>
        </div>
    </div>


        <!-- Custom Popup Modal for Loading & Success -->
    <div id="customModal" style="display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); backdrop-filter: blur(4px); align-items: center; justify-content: center;">
        <div style="background: white; padding: 30px; border-radius: 12px; text-align: center; max-width: 350px; width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.2); font-family: sans-serif;">
            
            <!-- Loading Spinner State -->
            <div id="modalLoadingState">
                <div style="border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 15px auto;"></div>
                <h3 style="margin: 0 0 10px 0; color: #333; font-size: 18px;">Please Wait...</h3>
                <p style="margin: 0; color: #666; font-size: 14px;">Your order is being saved to the system.</p>
            </div>

            <!-- Success State (Hidden initially) -->
            <div id="modalSuccessState" style="display: none;">
                <div style="font-size: 50px; color: #2ecc71; margin-bottom: 10px;">✅</div>
                <h3 style="margin: 0 0 10px 0; color: #333; font-size: 20px;">Success!</h3>
                <p id="successMessageText" style="margin: 0 0 20px 0; color: #666; font-size: 14px;">Order successfully submitted!</p>
                <button onclick="closeSuccessAndRedirect()" style="background: #2ecc71; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: bold; width: 100%;">OK</button>
            </div>

        </div>
    </div>

    <!-- Spinner Animation Style -->
    <style>
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    </style>

    <!-- JavaScript File එක Link කිරීම (සියලුම JS Code පහත script.js එකෙහි ඇත) -->
    <script src="script.js"></script>

</body>
</html>
