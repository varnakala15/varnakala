```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VarnaKala - Categories</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="categories.css">

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <link rel="icon" type="image/jpeg" href="web/logo.jpg">

</head>


<body>


    <!-- ========================= -->
    <!-- NAVBAR -->
    <!-- ========================= -->

    <header>

        <a href="index.html">

            <img
                src="web/logo.jpg"
                alt="VarnaKala Logo"
                class="main-logo">

        </a>


        <!-- Menu Icon -->

        <i
            class="bx bx-menu"
            id="menu-icon">
        </i>


        <!-- Navigation -->

        <ul class="Navbar">

            <li>
                <a href="index.html#home">
                    Home
                </a>
            </li>

            <li>
                <a href="index.html#about">
                    About Us
                </a>
            </li>

            <li>
                <a href="categories.html">
                    Categories
                </a>
            </li>

            <li>
                <a href="index.html#products">
                    Products
                </a>
            </li>

            <li>
                <a href="index.html#customers">
                    Customers
                </a>
            </li>

        </ul>


        <!-- Cart -->

        <div class="header-icon">

            <div class="cart-container">

                <span id="cart-count">
                    0
                </span>

                <i class="bx bx-cart cart-icon"></i>

            </div>

        </div>

    </header>



    <!-- ========================= -->
    <!-- CATEGORY SECTION -->
    <!-- ========================= -->

    <section class="categories-section">

        <h2 class="categories-title">
            Our Categories
        </h2>


        <div class="categories-container">



            <!-- Polo -->
            <div class="category-card">
                <a href="category-products.html?category=polo">
                    <img src="product/polo.jpg" alt="Polo">
                    <h3>Polo</h3>
                </a>
            </div>


            <!-- T-Shirt -->
            <div class="category-card">
                <a href="category-products.html?category=tshirt">
                    <img src="product/tshirt.jpg" alt="T-Shirt">
                    <h3>T-Shirt</h3>
                </a>
            </div>


            <!-- Shirt -->
            <div class="category-card">
                <a href="category-products.html?category=shirt">
                    <img src="product/shirt.jpg" alt="Shirt">
                    <h3>Shirt</h3>
                </a>
            </div>


            <!-- DTF Printing -->
            <div class="category-card">
                <a href="category-products.html?category=dtf">
                    <img src="product/dtf.jpg" alt="DTF Printing">
                    <h3>DTF Printing</h3>
                </a>
            </div>


            <!-- Embroidery -->
            <div class="category-card">
                <a href="category-products.html?category=embroidery">
                    <img src="product/embroidery.jpg" alt="Embroidery">
                    <h3>Embroidery</h3>
                </a>
            </div>


            <!-- Sublimation -->
            <div class="category-card">
                <a href="category-products.html?category=sublimation">
                    <img src="product/sublimation.jpg" alt="Sublimation">
                    <h3>Sublimation</h3>
                </a>
            </div>


            <!-- Custom -->
            <div class="category-card">
                <a href="customize.html">
                    <img src="product/custom.jpg" alt="Custom">
                    <h3>Custom</h3>
                </a>
            </div>


        </div>

    </section>



    <!-- JavaScript -->

    <script src="categories.js"></script>


</body>

</html>
