<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - DC Textile</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #27ae60;
            --danger-color: #e74c3c;
            --bg-color: #f4f6f9;
        }
        body { font-family: 'Poppins', sans-serif; background: var(--bg-color); padding: 20px; color: #333; }
        .admin-container { background: #fff; max-width: 1300px; margin: auto; padding: 30px; border-radius: 12px; box-shadow: 0 6px 15px rgba(0,0,0,0.08); }
        h2 { color: var(--primary-color); text-align: center; margin-bottom: 25px; font-weight: 600; }
        .table-responsive { width: 100%; overflow-x: auto; max-height: 550px; border-radius: 8px; border: 1px solid #e0e0e0; }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #eee; text-align: left; font-size: 13px; }
        th { background: var(--primary-color); color: #fff; position: sticky; top: 0; z-index: 10; font-weight: 500; text-transform: uppercase; }
        .space-row td { background-color: #cbd5e1 !important; padding: 6px !important; border-top: 2px solid #94a3b8; border-bottom: 2px solid #94a3b8; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; transition: all 0.3s ease; margin-right: 5px; }
        .btn:hover { transform: translateY(-1px); opacity: 0.9; }
        .btn-download { background: var(--accent-color); color: white; margin-bottom: 20px; }
        .btn-sync { background: #2980b9; color: white; margin-bottom: 20px; }
        .btn-pdf { background: #e67e22; color: white; margin-bottom: 20px; }
        .btn-clear { background: var(--danger-color); color: white; float: right; margin-bottom: 20px; }
        #login-section { text-align: center; margin: 80px auto; max-width: 400px; padding: 40px; background: #fff; border-radius: 12px; box-shadow: 0 6px 15px rgba(0,0,0,0.08); }
        input[type="password"] { padding: 12px; font-size: 15px; border-radius: 6px; border: 1px solid #ccc; width: 80%; margin-bottom: 15px; outline: none; }
    </style>
    <!-- PDF සෑදීමට අවශ්‍ය Library එක -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="icon" type="image/jpeg" href="web/logo.jpg">



</head>
<body>

    <!-- ඇමිනි ලොගින් කොටස -->
    <div id="login-section">
        <h2>Admin Login</h2>
        <input type="password" id="adminPass" placeholder="මුරපදය ඇතුළත් කරන්න">
        <br>
        <button class="btn btn-download" onclick="login()" style="width: 88%;">Login</button>
    </div>

    <!-- ඩෑෂ්බෝඩ් එක -->
    <div id="dashboard-section" class="admin-container" style="display: none;">
        <h2>DC Textile - Orders Dashboard</h2>
        
        <button class="btn btn-download" onclick="downloadCSV()">Export CSV</button>
        <button class="btn btn-sync" onclick="syncToGoogleSheet()">🔄 Sync to Google Sheet</button>
        <button class="btn btn-pdf" onclick="downloadPDF()">Download PDF</button>
        <button class="btn btn-clear" onclick="clearOrders()">Clear All</button>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>order id</th>
                        <th>date</th>
                        <th>time</th>
                        <th>customer name</th>
                        <th>phone number</th>
                        <th>whatsapp number</th>
                        <th>address</th>
                        <th>postal code</th>
                        <th>items names</th>
                        <th>size</th>
                        <th>Quntity</th>
                        <th>total</th>
                    </tr>
                </thead>
                <tbody id="orders-table"></tbody>
            </table>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwM5DFTzjiKAawbHw_htcARpR-_VY7TLBl-1eJCEnCwvcpRc20xFD4xceAVJnKwvOws/exec";

        function login() {
            let pass = document.getElementById('adminPass').value; 
            if (pass === "admin123") {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('dashboard-section').style.display = 'block';
                loadOrders();
            } else {
                alert("මුරපදය වැරදියයි!");
            }
        }

        function loadOrders() {
            let allOrders = JSON.parse(localStorage.getItem('allOrders')) || [];
            let tableBody = document.getElementById('orders-table');
            tableBody.innerHTML = '';

            if (allOrders.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="12" style="text-align:center; padding: 20px;">ගබඩා කර ඇති ඇණවුම් නොමැත.</td></tr>';
                return;
            }

            allOrders.forEach((order, orderIndex) => {
                let cust = order.customer || {};
                let dateTimeParts = order.date ? order.date.split(',') : ['', ''];
                let orderDate = dateTimeParts[0] ? dateTimeParts[0].trim() : '';
                let orderTime = dateTimeParts[1] ? dateTimeParts[1].trim() : '';

                if (order.items && order.items.length > 0) {
                    order.items.forEach((item, index) => {
                        let itemTotal = Number(item.price || 0) * Number(item.quantity || 0);
                        let row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${index === 0 ? (order.orderId || 'N/A') : ''}</td>
                            <td>${index === 0 ? orderDate : ''}</td>
                            <td>${index === 0 ? orderTime : ''}</td>
                            <td>${index === 0 ? (cust.name || 'N/A') : ''}</td>
                            <td>${index === 0 ? (cust.phone || 'N/A') : ''}</td>
                            <td>${index === 0 ? (cust.whatsapp || 'N/A') : ''}</td>
                            <td>${index === 0 ? (cust.address || 'N/A') : ''}</td>
                            <td>${index === 0 ? (cust.postal || 'N/A') : ''}</td>
                            <td>${item.name || ''}</td>
                            <td>${item.size || 'N/A'}</td>
                            <td>${item.quantity || 0}</td>
                            <td>Rs. ${itemTotal.toFixed(2)}</td>
                        `;
                        tableBody.appendChild(row);
                    });
                }

                if (orderIndex < allOrders.length - 1) {
                    let spaceRow = document.createElement('tr');
                    spaceRow.className = 'space-row';
                    spaceRow.innerHTML = `<td colspan="12"></td>`;
                    tableBody.appendChild(spaceRow);
                }
            });
        }

        function syncToGoogleSheet() {
            let allOrders = JSON.parse(localStorage.getItem('allOrders')) || [];
            if (allOrders.length === 0) {
                alert("ගූගල් ෂීට් එකට යැවීමට ඇණවුම් කිසිවක් නොමැත!");
                return;
            }

            let formattedData = [];

            allOrders.forEach(order => {
                let cust = order.customer || {};
                let dateTimeParts = order.date ? order.date.split(',') : ['', ''];
                let orderDate = dateTimeParts[0] ? dateTimeParts[0].trim() : '';
                let orderTime = dateTimeParts[1] ? dateTimeParts[1].trim() : '';

                if (order.items && order.items.length > 0) {
                    order.items.forEach((item, itemIndex) => {
                        let itemTotal = Number(item.price || 0) * Number(item.quantity || 0);
                        
                        formattedData.push({
                            orderId: (itemIndex === 0) ? (order.orderId || '') : '',
                            date: (itemIndex === 0) ? orderDate : '',
                            time: (itemIndex === 0) ? orderTime : '',
                            customerName: (itemIndex === 0) ? (cust.name || '') : '',
                            phone: (itemIndex === 0) ? (cust.phone || '') : '',
                            whatsapp: (itemIndex === 0) ? (cust.whatsapp || '') : '',
                            address: (itemIndex === 0) ? (cust.address || '') : '',
                            postal: (itemIndex === 0) ? (cust.postal || '') : '',
                            itemName: item.name || '',
                            size: item.size || 'N/A',
                            quantity: item.quantity || 0,
                            total: `Rs. ${itemTotal.toFixed(2)}`
                        });
                    });
                }
            });

            alert("දත්ත ගූගල් ෂීට් එකට යවමින් පවතී, කරුණාකර මොහොතක් රැඳී සිටින්න...");

            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(formattedData)
            })
            .then(() => {
                alert("සාර්ථකව දත්ත ගූගල් ෂීට් එකට යවන ලදී!");
            })
            .catch(error => {
                console.error("Error:", error);
                alert("යැවීමේ දෝෂයක් මතු විය. ඔබේ අන්තර්ජාල සම්බන්ධතාවය පරීක්ෂා කරන්න.");
            });
        }

        function downloadCSV() {
            let allOrders = JSON.parse(localStorage.getItem('allOrders')) || [];
            if (allOrders.length === 0) { alert("ඇණවුම් නොමැත!"); return; }
            let csvContent = "\uFEFForder id,date,time,customer name,phone number,whatsapp number,address,postal code,items names,size,Quntity,total\n";
            allOrders.forEach((order, index) => {
                let cust = order.customer || {};
                let dt = order.date ? order.date.split(',') : ['', ''];
                if (order.items) {
                    order.items.forEach((item, iIdx) => {
                        let itemTot = Number(item.price || 0) * Number(item.quantity || 0);
                        csvContent += `"${iIdx === 0 ? order.orderId : ""}","${iIdx === 0 ? dt[0].trim() : ""}","${iIdx === 0 ? dt[1] ? dt[1].trim() : "" : ""}","${iIdx === 0 ? cust.name : ""}","${iIdx === 0 ? cust.phone : ""}","${iIdx === 0 ? cust.whatsapp : ""}","${iIdx === 0 ? cust.address : ""}","${iIdx === 0 ? cust.postal : ""}","${item.name}","${item.size || 'N/A'}","${item.quantity}","Rs. ${itemTot.toFixed(2)}"\n`;
                    });
                }
                if (index < allOrders.length - 1) csvContent += ",,,,,,,,,,,\n";
            });
            let blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            let link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `DC_Orders_${Date.now()}.csv`;
            link.click();
        }

        function downloadPDF() {
            html2pdf().from(document.getElementById('dashboard-section')).save(`DC_Orders_${Date.now()}.pdf`);
        }

        function clearOrders() {
            if (confirm("සියලුම ඇණවුම් මකා දැමීමට අවශ්‍ය බව විශ්වාසද?")) {
                localStorage.removeItem('allOrders');
                loadOrders();
            }
        }
    </script>
</body>
</html>
